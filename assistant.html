<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>AI Assistant · Ledger</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <link rel="stylesheet" href="assets/css/variables.css" />
  <link rel="stylesheet" href="assets/css/base.css" />
  <link rel="stylesheet" href="assets/css/layout.css" />
  <link rel="stylesheet" href="assets/css/components.css" />
  <link rel="stylesheet" href="assets/css/dashboard.css" />
  <link rel="stylesheet" href="assets/css/animations.css" />
  <link rel="stylesheet" href="assets/css/mobile.css" />
</head>
<body>
<div class="bg-atmosphere" aria-hidden="true"></div>

  <div class="app-shell">

    <!-- ============ SIDEBAR ============ -->
    <aside class="sidebar">
      <!-- rendered by components/sidebar.js from nav-config.js -->
    </aside>

    <div>
      <!-- ============ TOPBAR ============ -->
      <header class="topbar">
        <div style="display:flex; align-items:center; gap: var(--sp-3);">
          <button class="btn--icon mobile-nav-toggle" data-mobile-nav-toggle aria-label="Open menu">
            <i class="fa-solid fa-bars"></i>
          </button>
          <div class="topbar__greeting">
            <h1>AI Finance Assistant</h1>
            <span class="topbar__date" data-fulldate>Loading date…</span>
          </div>
        </div>
        <div class="topbar__actions">
          <button class="btn--icon" data-theme-toggle aria-label="Toggle dark mode">
            <i class="fa-solid fa-moon"></i>
          </button>
        </div>
      </header>

      <!-- ============ MAIN CONTENT ============ -->
      <main class="main">

        <div class="glass card stagger-in" style="max-width: 720px; margin: 0 auto; width:100%;">
          <div class="card__header">
            <div style="display:flex; align-items:center; gap: var(--sp-3);">
              <span class="chip tone-violet card__icon"><i class="fa-solid fa-robot"></i></span>
              <div>
                <h3 style="margin:0;">Offline Assistant</h3>
                <span style="font-size: var(--fs-xs); color: var(--color-text-faint);">Rule-based · runs entirely in your browser · no data leaves this device</span>
              </div>
            </div>
          </div>

          <div class="assistant-thread" data-assistant-thread></div>

          <div style="display:flex; flex-wrap:wrap; gap: var(--sp-2); margin: var(--sp-3) 0;">
            <button type="button" class="suggestion-chip" data-suggestion>How much did I spend this month?</button>
            <button type="button" class="suggestion-chip" data-suggestion>Which category costs the most?</button>
            <button type="button" class="suggestion-chip" data-suggestion>Can I save $500 this month?</button>
            <button type="button" class="suggestion-chip" data-suggestion>Predict next month's expenses</button>
            <button type="button" class="suggestion-chip" data-suggestion>Suggest savings tips</button>
          </div>

          <form data-assistant-form style="display:flex; gap: var(--sp-3);">
            <input type="text" data-assistant-input placeholder="Ask about your finances…"
              style="flex:1; padding: 12px 16px; border-radius: var(--radius-pill); background: var(--color-surface-strong); border: 1px solid var(--color-surface-border-strong); color: var(--color-text); outline:none;" />
            <button type="submit" class="btn btn--primary"><i class="fa-solid fa-paper-plane"></i></button>
          </form>
        </div>

      </main>
    </div>
  </div>

  <script src="assets/js/utils/storage.js"></script>
  <script src="assets/js/utils/helpers.js"></script>
  <script src="assets/js/utils/transactions.js"></script>
  <script src="assets/js/utils/seed.js"></script>
  <script src="assets/js/components/theme.js"></script>
  <script src="assets/js/nav-config.js"></script>
  <script src="assets/js/components/sidebar.js"></script>
  <script src="assets/js/components/subtabs.js"></script>
  <script src="assets/js/components/toast.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/assistant.js"></script>
</body>
</html>
